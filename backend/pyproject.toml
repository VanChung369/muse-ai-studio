[project]
name = "muse-ai-studio-backend"
version = "0.1.0"
description = "FastAPI backend for Muse AI Studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "playwright>=1.65.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
